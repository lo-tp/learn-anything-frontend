# Learn Anything — development environment.
#
# One service only: the Postgres db. The app itself is never containerized.
#
# Run with podman (the Docker daemon stays off):
#   podman compose up -d
#   podman compose down
#
# The db binds 5434 (not 5432/5433) so it never clashes with host Postgres.
# Scripts (scripts/dev-db.sh, scripts/test-db.sh) create the actual
# databases (learn_anything, learn_anything_test) inside this container.

services:
  db:
    image: postgres:17
    container_name: learn-anything-db
    environment:
      POSTGRES_DB: learn_anything
      POSTGRES_USER: learn_anything
      POSTGRES_PASSWORD: learn_anything
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn_anything -d learn_anything"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
