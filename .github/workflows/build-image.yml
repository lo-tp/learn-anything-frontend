# Builds the frontend image and pushes it to Artifact Registry.
#
# Same authentication path as the backend's workflow: the job trades its GitHub OIDC
# token for a federated token as `deploy-ci` (Workload Identity Federation set up in
# lo-tp/learn-anything-infra, `gcp/ci_identity.tf`), so there is no stored
# credential and no `gcloud` install of a key. Two details that were learned rather
# than known, kept here so the next repository does not repeat them:
#
#   * the provider is addressed by **project number** (`terraform output
#     workload_identity_provider_names` in the infra root); the project-id form gets
#     `invalid_target` from STS and a message claiming the provider is missing;
#   * the registry token is minted with `gcloud auth print-access-token`. Passing
#     `auth`'s `access_token` output to login-action delivered an empty password and
#     the unhelpful error "Password required".
#
# This image is environment-specific: `NEXT_PUBLIC_*` is inlined at build time, so
# the origins are build args and the artifact for staging is a different artifact.
# Only the production one is built today, because the staging hostnames are declared
# by neither DNS nor Terraform yet (infra PLAN.md M6) — a build arg invented before
# the record exists is how an image ends up pointing at a name nobody owns.

name: build image

on:
  # `main` is verified, never published. `release` is the only branch that builds
  # and pushes an image: promoting main into `release` (by merge, never by
  # committing on it) is the human act that means "this goes live", and
  # lo-tp/learn-anything-infra pins the digest that comes out of it.
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token the workload identity provider trusts

env:
  PROJECT_ID: learn-anything-510905
  REGISTRY: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything
  IMAGE: learn-anything-frontend
  WIF_PROVIDER: projects/358071090957/locations/global/workloadIdentityPools/learn-anything-github/providers/lo-tp-learn-anything-frontend
  WIF_SERVICE_ACCOUNT: deploy-ci@learn-anything-510905.iam.gserviceaccount.com

  # The origins this artifact is baked with, and the reason they live in this file
  # rather than in the image: they are what a browser is told to call, so they are
  # part of what a review approves. They must agree with the infra side
  # (learn-anything-infra `manifests/overlays/prod` sets the backend's
  # FRONTEND_DOMAIN and the sandbox's allowlist); when the two disagree, the browser
  # gets one answer and the server another, which shows up as CORS and cookie
  # errors rather than a failed build.
  NEXT_PUBLIC_BACKEND_URL: https://api.lotp.xyz
  NEXT_PUBLIC_SANDBOX_ORIGIN: https://sandbox.lotp.xyz

jobs:
  # Lint, typecheck and the coverage-gated test suite in CI, before anything is
  # built — the same commands `npm run check` chains locally. Node is pinned to the
  # major the image uses (`FROM node:24-slim` in the Dockerfile): checking a
  # different runtime than the one that ships is how a green CI and a broken image
  # coexist.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run check

  build:
    needs: check
    # Only `release` produces an image. Everything else is checked and stops there.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          # Long enough to build and push, no longer.
          access_token_lifetime: 1800s

      - id: ar_token
        name: Access token for Artifact Registry
        run: |
          token=$(gcloud auth print-access-token)
          [ -n "$token" ] || { echo "::error::no access token; the workload identity step did not leave a usable credential" >&2; exit 1; }
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.ar_token.outputs.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          # The cluster schedules amd64; stating the platform also keeps a local
          # build on an Apple-silicon laptop from producing something the cluster
          # would never run.
          platforms: linux/amd64
          # `|` is load-bearing, not style. Without it this is a plain multi-line
          # YAML scalar, and YAML **folds the newlines into spaces**: the action
          # receives one string, passes one `--build-arg`, and the Dockerfile's first
          # ARG swallows the rest of the line. The first shipped image baked
          # `NEXT_PUBLIC_BACKEND_URL` as
          # `https://api.lotp.xyz NEXT_PUBLIC_SANDBOX_ORIGIN=https://sandbox.lotp.xyz`,
          # so every browser request went to `https://api.lotp.xyz%20…/auth/login`.
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ env.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_SANDBOX_ORIGIN=${{ env.NEXT_PUBLIC_SANDBOX_ORIGIN }}
          # Not pushed from here: the smoke step below has to pass first. An image
          # that cannot serve a request should not be in the registry with a
          # `sha-<commit>` tag on it, because the next person to deploy would find
          # it there and reasonably assume it had been run.
          push: false
          # Load it into the runner's Docker as well, so the step below can run the
          # artifact this job just built. A successful build proves the bundler ran;
          # it does not prove the image can serve a page.
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image's contract, checked against the artifact: it starts as its own
      # user, sends an anonymous visitor to sign-in (that is what proxy.ts does),
      # renders that page with real translated text — the proof that `messages/` is
      # inside the image, since i18n/request.ts imports it through a runtime-computed
      # specifier that file tracing cannot see — and the origins baked in at build
      # time are the ones this workflow declared.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name fe-smoke -p 3000:3000 -e JWT_SECRET=smoke-test-only \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          code=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$code" = 307 ] || [ "$code" = 200 ]; then break; fi
            sleep 2
            if [ "$i" = 30 ]; then echo "never became ready (last code: $code)"; docker logs fe-smoke; exit 1; fi
          done
          # An anonymous request is redirected to the sign-in page, not served a page.
          test "$code" = 307
          page=$(curl -sL http://127.0.0.1:3000/en/login)
          printf '%s' "$page" | grep -qi '<title>'
          printf '%s' "$page" | grep -qi 'sign in'
          # Inside the image, not on the runner: the built chunks must carry the
          # origins this workflow passed in as build args. Asserted at the string
          # boundary on purpose — the substring version of this check
          # (`grep -q "$URL"`) passed on an image whose baked value was that origin
          # *plus a space and more text*, which is the exact defect it is supposed
          # to catch. A prefix is not the value.
          #
          # The shape that is legal and must not be rejected: a baked origin is a
          # *prefix* of a longer quoted string when the code appends a path, so
          # `"https://sandbox.lotp.xyz/slides/"` is normal. What is never legal is a
          # space or a second assignment after it — the signature of two build args
          # folded into one.
          docker exec -e WANT_BACKEND="${{ env.NEXT_PUBLIC_BACKEND_URL }}" \
                      -e WANT_SANDBOX="${{ env.NEXT_PUBLIC_SANDBOX_ORIGIN }}" \
            fe-smoke sh -c '
              set -eu
              for u in "$WANT_BACKEND" "$WANT_SANDBOX"; do
                grep -q "\"$u" .next/static/**/*.js 2>/dev/null ||
                  grep -rq "$u" .next/static ||
                  { echo "origin was not baked into the image: $u"; exit 1; }
              done
              bad=$(grep -rhoE "https?://[A-Za-z0-9.-]*lotp\.xyz[^\"]{0,40}" .next/static |
                    grep -E "[[:space:]]" | sort -u | head -3 || true)
              if [ -n "$bad" ]; then
                printf "a baked origin has text appended to it:\n%s\n" "$bad"
                exit 1
              fi
            '
          docker rm -f fe-smoke

      # The infra side pins a digest, not a tag: a tag can be re-pointed under a
      # running rollout and a digest cannot. Surfaced so promoting an image is a
      # copy, not a guess.
      # Published only after the smoke step passed, and only from `main`.
      - if: github.event_name == 'push'
        name: Publish the image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}

      - if: github.event_name == 'push'
        run: |
          {
            echo "## Image"
            echo "- tag: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- baked origins: backend \`${{ env.NEXT_PUBLIC_BACKEND_URL }}\`, sandbox \`${{ env.NEXT_PUBLIC_SANDBOX_ORIGIN }}\`"
            echo
            echo "Pin the digest in learn-anything-infra \`manifests/overlays/prod/kustomization.yaml\`."
          } >> "$GITHUB_STEP_SUMMARY"
